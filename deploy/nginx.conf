# deploy/nginx.conf
#
# Proxy reverso Nginx → Gunicorn (127.0.0.1:8000).
# Instalação:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/projeto-saida
#   sudo ln -s /etc/nginx/sites-available/projeto-saida /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois rode o Certbot para HTTPS (veja deploy/DEPLOY.md):
#   sudo certbot --nginx -d seu-dominio.com.br
#
# Troque "seu-dominio.com.br" e os caminhos /opt/projeto_saida abaixo.

server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br;

    # Limite de upload. Fica um pouco ACIMA do MAX_CONTENT_LENGTH do Flask
    # (config.py, hoje 110M) de propósito: se os dois valores fossem iguais,
    # uma requisição no limite exato poderia ser rejeitada pelo Nginx ANTES
    # de chegar ao Flask — e aí quem responde é o Nginx, sem a mensagem
    # amigável por campo que app/error_handlers.py mostra. Com essa margem,
    # o Flask normalmente é quem recusa primeiro (com a mensagem certa);
    # o Nginx só entra em ação nos casos realmente fora da curva.
    # Se mudar o valor do Flask, ajuste este também (mantendo a margem).
    client_max_body_size 120M;

    # Página amigável quando o Nginx é quem rejeita por causa do limite
    # acima (ver deploy/static-error-pages/413.html) — sem isso, o
    # usuário veria a página padrão e genérica do Nginx ("413 Request
    # Entity Too Large"), sem nenhuma explicação do que aconteceu.
    error_page 413 /erro-upload-grande.html;
    location = /erro-upload-grande.html {
        internal;
        alias /opt/projeto_saida/deploy/static-error-pages/413.html;
    }

    access_log /var/log/nginx/projeto-saida.access.log;
    error_log  /var/log/nginx/projeto-saida.error.log;

    # Arquivos estáticos direto pelo Nginx — mais rápido que passar pelo
    # Gunicorn, e libera os workers só para lógica de aplicação.
    location /static/ {
        alias /opt/projeto_saida/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Necessário para o ProxyFix (app/__init__.py) enxergar IP/esquema
        # reais do cliente por trás deste proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Cabeçalhos de segurança básicos (complementam os que o Flask já envia
    # em app/__init__.py::_init_response_headers).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Depois de rodar o Certbot, ele cria automaticamente um bloco "listen 443
# ssl" acima e um redirecionamento HTTP→HTTPS. Não é preciso escrever isso
# manualmente.
